services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_local_only
      POSTGRES_DB: erp
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp -d erp']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.6-alpine
    ports:
      - '127.0.0.1:6379:6379'
    command: ['redis-server', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
