name: Quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://erp:ci-only-password@127.0.0.1:5432/erp_test?schema=public
      TEST_DATABASE_URL: postgresql://erp:ci-only-password@127.0.0.1:5432/erp_test?schema=public
    steps:
      - name: Verify Git Flow target
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ "$PR_HEAD" == feature/* && "$PR_BASE" != develop ]]; then
            echo "::error::Feature pull requests must target develop."
            exit 1
          fi
          if [[ "$PR_BASE" == main && "$PR_HEAD" != release/* && "$PR_HEAD" != hotfix/* ]]; then
            echo "::error::Only release or hotfix pull requests may target main."
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-fund
      - run: npm run prisma:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
