services:
  postgres-test:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_test_only
      POSTGRES_DB: erp_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp -d erp_test']
      interval: 2s
      timeout: 3s
      retries: 15
  redis-test:
    image: redis:7.4.6-alpine
    ports:
      - '127.0.0.1:56379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15
